<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRally Recce Note Digitiser</title>

  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --paper-bg: #ffffff;
      --accent: #27ae60;
      --text: #e0e0e0;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    .app-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
      align-items: start;
    }

    @media (max-width: 850px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      padding: 16px;
      border: 1px solid #333;
      border-radius: 8px;
      background: var(--card-bg);
    }

    /* Seamless container for the pace sheet preview */
    .preview-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h2 {
      margin-bottom: 12px;
      color: #fff;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: #aaa;
      font-size: 0.85rem;
    }

    input[type="password"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
      font-size: 0.95rem;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      font-family: monospace;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid #93c5fd;
      outline-offset: 2px;
    }

    .preview-box {
      display: flex;
      width: 100%;
      height: 250px;
      margin-top: 10px;
      overflow: hidden;
      align-items: center;
      justify-content: center;
      border: 2px dashed #444;
      border-radius: 6px;
      background: #181818;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .preview-placeholder {
      padding: 12px;
      color: #888;
      text-align: center;
    }

    .toast {
      display: none;
      margin-top: 8px;
      padding: 8px;
      border-radius: 4px;
      color: #fff;
      font-size: 0.9rem;
      overflow-wrap: anywhere;
    }

    /* Printed pace sheet styling */
    .pace-sheet {
      padding: 30px 40px;
      background: var(--paper-bg);
      color: #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      font-family: Arial, Helvetica, sans-serif;
      border-radius: 4px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      padding-bottom: 4px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .header-double-rule {
      border-top: 2px solid #000;
      border-bottom: 1px solid #000;
      height: 2px;
      margin-bottom: 30px;
    }

    .stage-banner {
      margin: 20px 0 30px;
      text-align: center;
      text-transform: uppercase;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .stage-rule {
      border-bottom: 1px solid #000;
      margin-bottom: 25px;
    }

    .notes-table {
      width: 100%;
      border-collapse: collapse;
    }

    .note-row {
      border-bottom: 1px solid #ccc;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .note-cell {
      padding: 18px 0;
      vertical-align: middle;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .callout {
      text-align: left;
      overflow-wrap: anywhere;
    }

    .distance {
      width: 100px;
      text-align: right;
      font-size: 1.6rem;
      font-weight: 800;
      white-space: nowrap;
    }

    /* Pacenote Underline Formatting */
    .u {
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
    }

    /* Pacenote Circle Symbol (Crest, No Cut, etc.) */
    .circled {
      display: inline-flex;
      width: 1.3em;
      height: 1.3em;
      margin: 0 3px;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #000;
      border-radius: 50%;
      font-size: 0.8em;
      font-weight: 600;
      vertical-align: middle;
      line-height: 1;
    }

    @media print {
      @page {
        size: A4;
        margin: 10mm;
      }

      body {
        padding: 0;
        background: #fff;
        color: #000;
      }

      .app-container {
        display: block;
      }

      .panel:first-child,
      button {
        display: none !important;
      }

      .pace-sheet {
        width: 100%;
        padding: 20px 30px;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
  <main class="app-container">
    <section class="panel" aria-labelledby="captureHeading">
      <h2 id="captureHeading">1. Recce Note Capture</h2>

      <div class="field">
        <label for="apiKey">Gemini API Key</label>
        <input
          type="password"
          id="apiKey"
          autocomplete="off"
          placeholder="Enter your Gemini API key"
        >
      </div>

      <div class="field">
        <label for="imageInput">Upload or Capture Recce Photo</label>
        <input
          type="file"
          id="imageInput"
          accept="image/*"
          capture="environment"
        >
      </div>

      <div class="preview-box" id="previewContainer" aria-label="Photo preview">
        <span class="preview-placeholder">No Photo Selected</span>
      </div>

      <button id="transcribeBtn" type="button" disabled>
        Transcribe Recce (API)
      </button>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <div class="field" style="margin-top: 16px;">
        <label for="rawNotes">Raw Transcribed Text (Editable)</label>
        <textarea
          id="rawNotes"
          placeholder="Transcribed text will appear here..."
        >QRALLY TEST
L2 CREST KEEP CENTRE
R6 - L5 100
R3> - L3 Dip 50
R6 100
R5 LNG 50
NOTES BY RODGE
R3 50 L3 DIP CAUTION
R4 40</textarea>
      </div>

      <button id="renderBtn" type="button" style="background: #e67e22;">
        Re-Render Layout
      </button>
    </section>

    <!-- Clean Output Area without extra panel header/border -->
    <section class="preview-panel">
      <div class="pace-sheet" id="paceSheet">
        <div class="header-top">
          <span>STAGE: SS7</span>
          <span>PAGE: 1</span>
        </div>
        <div class="header-double-rule"></div>

        <div class="stage-banner">SS7 - GARTHENIOG</div>
        <div class="stage-rule"></div>

        <table class="notes-table">
          <tbody id="notesBody"></tbody>
        </table>
      </div>

      <button id="printBtn" type="button" style="background: #34495e; margin-top: 0;">
        Print / Save A4 PDF
      </button>
    </section>
  </main>

  <script>
    const MODEL_ID = "gemini-3.5-flash-lite";

    let base64ImageData = "";
    let imageMimeType = "image/jpeg";
    let activeReader = null;

    const imageInput = document.getElementById("imageInput");
    const previewContainer = document.getElementById("previewContainer");
    const transcribeBtn = document.getElementById("transcribeBtn");
    const rawNotes = document.getElementById("rawNotes");
    const notesBody = document.getElementById("notesBody");

    function showToast(message, isError = false) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.style.display = "block";
      toast.style.background = isError ? "#7f1d1d" : "#14532d";
    }

    function showPreviewPlaceholder(message) {
      const placeholder = document.createElement("span");
      placeholder.className = "preview-placeholder";
      placeholder.textContent = message;
      previewContainer.replaceChildren(placeholder);
    }

    imageInput.addEventListener("change", (event) => {
      const file = event.target.files && event.target.files[0];

      base64ImageData = "";
      imageMimeType = "image/jpeg";
      transcribeBtn.disabled = true;

      if (activeReader && activeReader.readyState === FileReader.LOADING) {
        activeReader.abort();
      }
      activeReader = null;

      if (!file) {
        showPreviewPlaceholder("No Photo Selected");
        return;
      }

      if (!file.type || !file.type.startsWith("image/")) {
        imageInput.value = "";
        showPreviewPlaceholder("Please select an image file");
        showToast("The selected file is not an image.", true);
        return;
      }

      imageMimeType = file.type;
      showPreviewPlaceholder("Loading photo...");

      const reader = new FileReader();
      activeReader = reader;

      reader.onload = () => {
        if (activeReader !== reader || typeof reader.result !== "string") {
          return;
        }

        const commaIndex = reader.result.indexOf(",");
        if (commaIndex === -1) {
          base64ImageData = "";
          showPreviewPlaceholder("Could not load photo");
          showToast("The selected image could not be read.", true);
          return;
        }

        base64ImageData = reader.result.slice(commaIndex + 1);

        const image = document.createElement("img");
        image.src = reader.result;
        image.alt = "Selected recce note photo";
        previewContainer.replaceChildren(image);

        transcribeBtn.disabled = false;
        showToast("Photo loaded: " + file.name);
      };

      reader.onerror = () => {
        if (activeReader !== reader) return;

        base64ImageData = "";
        showPreviewPlaceholder("Could not load photo");
        showToast("The selected image could not be read.", true);
      };

      reader.onabort = () => {
        if (activeReader === reader) {
          activeReader = null;
        }
      };

      reader.readAsDataURL(file);
    });

    transcribeBtn.addEventListener("click", processImageLive);
    document.getElementById("renderBtn").addEventListener("click", renderPaceSheet);
    document.getElementById("printBtn").addEventListener("click", () => {
      window.setTimeout(() => window.print(), 100);
    });

    async function processImageLive() {
      const apiKey = document.getElementById("apiKey").value.trim();

      if (!apiKey) {
        showToast("Please enter your full Gemini API key.", true);
        return;
      }

      if (!base64ImageData) {
        showToast("Please select a photo and wait for it to load.", true);
        return;
      }

      transcribeBtn.disabled = true;
      transcribeBtn.textContent = "Transcribing...";
      showToast("Analyzing recce shorthand...");

      const endpoint =
        `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${encodeURIComponent(apiKey)}`;

      const promptText =
        "Transcribe these handwritten rally pace notes line by line exactly as written. " +
        "Output ONLY raw line-by-line shorthand text without extra commentary or markdown.";

      const payload = {
        contents: [{
          parts: [
            { text: promptText },
            {
              inline_data: {
                mime_type: imageMimeType,
                data: base64ImageData
              }
            }
          ]
        }]
      };

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const responseText = await response.text();
        let data;

        try {
          data = responseText ? JSON.parse(responseText) : {};
        } catch {
          throw new Error(
            `The API returned an unreadable response (HTTP ${response.status}).`
          );
        }

        if (!response.ok || data.error) {
          const message = data?.error?.message || response.statusText || "Request failed";
          throw new Error(`Google API error (HTTP ${response.status}): ${message}`);
        }

        const parts = data?.candidates?.[0]?.content?.parts;
        const transcription = Array.isArray(parts)
          ? parts
              .filter((part) => typeof part.text === "string")
              .map((part) => part.text)
              .join("")
              .trim()
          : "";

        if (!transcription) {
          const blockReason = data?.promptFeedback?.blockReason;
          throw new Error(
            blockReason
              ? `The request was blocked: ${blockReason}.`
              : "Could not extract text. Check the photo clarity and API response."
          );
        }

        rawNotes.value = transcription;
        renderPaceSheet();
        showToast("Transcription complete. Please check it against the original notes.");
      } catch (error) {
        showToast(error.message || "Network error.", true);
      } finally {
        transcribeBtn.disabled = !base64ImageData;
        transcribeBtn.textContent = "Transcribe Recce (API)";
      }
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>'"]/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      })[character]);
    }

    function renderPaceSheet() {
      const lines = rawNotes.value.trim().split(/\r?\n/);
      notesBody.replaceChildren();

      for (const line of lines) {
        const trimmedLine = line.trim();
        if (!trimmedLine) continue;

        let calloutText = trimmedLine;
        let distanceText = "";

        const distanceMatch = trimmedLine.match(/^(.*?)\s+(\d+)$/);
        if (distanceMatch) {
          calloutText = distanceMatch[1].trim();
          distanceText = distanceMatch[2];
        }

        let formattedCallout = escapeHTML(calloutText);

        // Turn severity underlining (L1-6, R1-6 with optional +/-)
        formattedCallout = formattedCallout.replace(
          /\b([RL]\d[+-]?)(?![A-Za-z0-9])/gi,
          '<span class="u">$1</span>'
        );

        // Circled symbols: (C), (N), etc.
        formattedCallout = formattedCallout.replace(
          /\((C|N|D\/C|DC)\)/gi,
          '<span class="circled">$1</span>'
        );

        const row = document.createElement("tr");
        row.className = "note-row";

        const calloutCell = document.createElement("td");
        calloutCell.className = "note-cell callout";
        calloutCell.innerHTML = formattedCallout;

        const distanceCell = document.createElement("td");
        distanceCell.className = "note-cell distance";
        distanceCell.textContent = distanceText;

        row.append(calloutCell, distanceCell);
        notesBody.appendChild(row);
      }
    }

    // Initial render
    renderPaceSheet();
  </script>
</body>
</html>
